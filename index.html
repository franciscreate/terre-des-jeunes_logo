}
html,body{height:100%}
body{margin:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:3vmin;box-sizing:border-box;overflow:hidden}
svg{width:100%;height:100%;overflow:visible;display:block}
path{fill:var(--logo)}
svg *{transform-box:fill-box}

.wind{transform-origin:50% 100%;animation:sway 4.2s ease-in-out infinite alternate}
.wind.arrow{transform-box:view-box;transform-origin:850px 1240px;animation-name:swayArrow}
@keyframes sway{from{transform:rotate(-2.6deg)}to{transform:rotate(2.6deg)}}
@keyframes swayArrow{from{transform:rotate(-1.35deg)}to{transform:rotate(1.35deg)}}

@media (prefers-reduced-motion:reduce){
  svg *{animation:none!important}
}
</style>
